spring:
  application:
    name: verify-jwt-sig-with-keystore

service:
  peer:
    base-url: ${SERVICE_PEER_BASE_URL:http://localhost:8080}
    required-scopes: peer.private
  oauth:
    token-url: ${SERVICE_OAUTH_TOKEN_URL:http://localhost:9090/oauth/token}
    client-id: ${SERVICE_OAUTH_CLIENT_ID:verify-jwt-sig-with-keystore}
    client-secret: ${SERVICE_OAUTH_CLIENT_SECRET:replace-me}
  jwt:
    verification-mode: KEYSTORE
    issuer: ${SERVICE_JWT_ISSUER:https://issuer.example.test}
    audiences: peer-api
    required-scopes: peer.private
    header-claims:
      typ: JWT
    claim-equals:
      /client_id: caller-a
      /user_name: george
    keystore:
      location: ${SERVICE_JWT_KEYSTORE_LOCATION:file:${java.io.tmpdir}/service-app-jwt-verifier.p12}
      type: ${SERVICE_JWT_KEYSTORE_TYPE:PKCS12}
      password: ${SERVICE_JWT_KEYSTORE_PASSWORD:changeit}
      alias: ${SERVICE_JWT_KEYSTORE_ALIAS:jwt}
